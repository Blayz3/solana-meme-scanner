name: scanner

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 min (GitHub suele demorar unos minutos más)
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # estado.json recuerda a qué tokens ya te avisó, para no repetir cada 20 min
      - uses: actions/cache@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: buscar
        env:
          SMART_JSON: ${{ secrets.SMART_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scanner.py --once
