name: scanner

on:
  schedule:
    - cron: "0 */6 * * *"   # relevo cada 6h; cada job corre 5h45 seguidas
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: vigilar
        env:
          SMART_JSON: ${{ secrets.SMART_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout 20700 python3 scanner.py || true
